services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wager
      POSTGRES_USER: wager
      POSTGRES_PASSWORD: wager
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wager -d wager"]
      interval: 5s
      timeout: 3s
      retries: 20

  localstack:
    image: localstack/localstack:4
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      PERSISTENCE: "1"
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack
      - ./infra/localstack-init.sh:/etc/localstack/init/ready.d/10-create-queues.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health | grep -q 'sqs' "]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    build: .
    environment:
      PORT: 3000
      DATABASE_URL: postgres://wager:wager@postgres:5432/wager
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://localstack:4566
      WAGER_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      WAGER_DLQ_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions-dlq.fifo
      OUTBOX_QUEUE_URL: http://localstack:4566/000000000000/wager-events.fifo
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

volumes:
  postgres-data:
  localstack-data: